<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晨光笔记</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <span class="brand">晨光笔记</span>
    <span class="tagline">把想法留在早上最好的光里</span>
  </header>
  <main>
    <section class="hero">
      <h1>每天一句，就够记下一天</h1>
      <p>晨光笔记是一个极简的记录练习：早上写一句，晚上回头看，日子就有了形状。</p>
    </section>
    <section class="cards">
      <article class="card">
        <h2>一句话</h2>
        <p>不用长篇大论，一句今天最想记住的话就好。</p>
      </article>
      <article class="card">
        <h2>回头看</h2>
        <p>翻到上周的今天，看看那时候在想什么。</p>
      </article>
      <article class="card">
        <h2>不打扰</h2>
        <p>没有提醒，没有红点，想写的时候再来。</p>
      </article>
    </section>
  </main>
  <footer>晨光笔记 · 一个演示页面</footer>
</body>
</html>
